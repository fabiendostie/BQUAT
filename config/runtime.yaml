{
  "runtime":
    { "storage_root": "runs", "log_level": "info", "max_retries": 1, "step_timeout_seconds": 1800 },
  "tools":
    {
      "allowlist": [],
      "blocklist": [],
      "timeout_seconds": 30,
      "risk_policy": { "high_requires_approval": true, "medium_requires_approval": false },
    },
  "automation": { "phases": ["Phase 4 Implementation", "Phase 4 Production", "Testing/QA"] },
  "hitl": { "mode": "blocking", "require_conditional": false, "approval_interface": "cli" },
  "providers":
    {
      "default": "ollama",
      "reliability":
        {
          "enabled": true,
          "timeout_seconds": 60,
          "max_retries": 2,
          "backoff_seconds": 0.5,
          "backoff_factor": 2.0,
          "backoff_max_seconds": 8.0,
          "jitter_seconds": 0.2,
          "circuit_breaker": { "enabled": true, "failure_threshold": 3, "reset_seconds": 30 },
        },
      "mock": { "type": "mock", "model": "mock" },
      "ollama": { "type": "ollama", "base_url": "http://localhost:11434", "model": "llama3" },
      "litellm": { "type": "litellm", "base_url": "http://localhost:4000", "model": "gpt-4" },
      "openai": { "type": "openai", "model": "gpt5", "api_key_env": "OPENAI_API_KEY" },
      "claude": { "type": "anthropic", "model": "claude-4", "api_key_env": "ANTHROPIC_API_KEY" },
      "gemini": { "type": "gemini", "model": "gemini-3", "api_key_env": "GEMINI_API_KEY" },
      "groq": { "type": "groq", "model": "llama3-70b", "api_key_env": "GROQ_API_KEY" },
    },
}
