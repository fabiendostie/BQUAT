[project]
name = "baqt"
version = "1.0.0"
description = "BAQT unified installer - BMAD + TELIS + QUINT autonomous framework"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
baqt = "installer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "BMAD-METHOD",
  "quint-code",
  "node_modules",
  "runs",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
cache_dir = ".mypy_cache2"
exclude = "BMAD-METHOD|quint-code|node_modules|runs|\\.pytest_cache|\\.ruff_cache"
