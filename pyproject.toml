[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "BMAD-METHOD",
  "quint-code",
  "node_modules",
  "runs",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = "BMAD-METHOD|quint-code|node_modules|runs|\\.pytest_cache|\\.ruff_cache"
